[project]
name = "atelier"
version = "0.0.1"
description = "Local, open-source, Discord-driven studio for automated science YouTube Shorts (codename Atelier/1)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Hasan Nadeem" }]
keywords = ["youtube", "automation", "agents", "local-llm", "discord", "content-generation"]
# Runtime dependencies are pinned in requirements.txt (the install source of truth).
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
# Pragmatic default: pyflakes (F), pycodestyle errors (E), import sorting (I),
# a few bugbear checks (B), and pyupgrade (UP). Not overly strict during scaffold.
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length handled by the formatter, not the linter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
