name: 💡 Feature request / idea
description: Suggest an improvement, new agent, or capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The motivation - what's painful or missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see. If it's a non-obvious design decision, it will likely need an ADR.
    validations:
      required: true
  - type: dropdown
    id: constraints
    attributes:
      label: Does it respect the project's hard constraints?
      description: See CONTRIBUTING.md. Tick any you've considered.
      multiple: true
      options:
        - "Monetization-license safe (Apache/MIT/OpenRAIL++/CC-0 in published frames)"
        - "Runs on the AMD gfx1010 / 8 GB target (Vulkan/ZLUDA, no ROCm)"
        - "Keeps the human approval gates / fact-checking intact"
        - "Doesn't break the three seams"
        - "Not sure - needs discussion"
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
